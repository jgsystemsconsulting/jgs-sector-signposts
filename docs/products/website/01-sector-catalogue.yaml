# RR-B-19 marketing-content entry: AI-ingestible product YAML for the public website.
# Features / positioning only. NO pricing.

slug: jgs-sector-signposts
name: Rail, Space, and Maritime Knowledge Packs
tagline: >
  Installable standards signposts (pointers only) for coding agents in rail,
  space, and maritime work: designation, edition, owner, and where to get the
  authentic text.
product_class: agent-skills
status: live
version: "0.1.0"
repository: https://github.com/jgsystemsconsulting/jgs-sector-signposts
license: MIT (tooling and signposts); citation-only signpost pointers, no third-party content
vendor: JG Systems Consulting Ltd.

positioning: >
  A signpost turns a standards landscape into a skill a coding agent loads on demand.
  This catalogue carries three of them, for rail, space, and maritime, where the
  governing standards are paywalled or copyright-restricted. Each row names the
  document and its owner and links the owner's page; no standard text is included.

audience:
  - Practitioners working in Rail, Space, and Maritime
  - Anyone using a coding agent who needs grounded Rail, Space, and Maritime reference answers

features:
  - title: Licence-vetted by construction
    detail: >
      Every row is a citation only: designation, title, edition, owner, status, and
      the owner's URL. Paywalled and restricted texts stay with their owners.
  - title: Progressive disclosure
    detail: >
      Each signpost is one SKILL.md with grouped row tables, so the agent reads only
      the rows that match the question.
  - title: /signposts orchestrator
    detail: >
      An explicit /signposts <question> entry point for when you do not know which
      pack to ask. Routes through a curated topic map to the right packs. Carries no
      source content itself.
  - title: Open Agent Skills format, multi-agent install
    detail: >
      Packs follow the open agentskills.io SKILL.md standard. One stdlib-only installer
      targets multiple coding agents.
  - title: No runtime dependencies
    detail: >
      Plain Markdown. No MCP server, API key, or licence tier needed at runtime.

links:
  repository: https://github.com/jgsystemsconsulting/jgs-sector-signposts
  changelog: https://github.com/jgsystemsconsulting/jgs-sector-signposts/blob/main/CHANGELOG.md
  skills_index: https://github.com/jgsystemsconsulting/jgs-sector-signposts/blob/main/SKILLS.md
